<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пульс Тур</title>
<link rel="icon" href="/app/icon-192.png">
<style>
:root{--bg:#f5f6fa;--text:#161a26;--muted:#646b7d;--card:#fff;--line:#e3e5ee;--accent:#6366f1}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d12;--text:#eef0f6;--muted:#8d93a6;--card:#141720;--line:#262a37}}
*{box-sizing:border-box;margin:0}body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
main{max-width:560px;margin:10vh auto;text-align:center}h1{font-size:32px;margin-bottom:8px}p{color:var(--muted)}
.cards{display:grid;gap:12px;margin-top:28px}a.c{display:block;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);text-align:left}
a.c:hover{border-color:var(--accent)}a.c b{display:block;font-size:17px}
</style>
</head>
<body><main>
<h1>Пульс Тур</h1>
<p>Расписание тура с напоминаниями: трансферы, экскурсии и вылеты — вовремя.</p>
<div class="cards">
<a class="c" href="/app/"><b>🧳 Я турист</b><span>Открыть расписание по коду из памятки</span></a>
<a class="c" href="/admin/"><b>🏢 Я из турфирмы</b><span>Вход в офис: группы, расписание, туристы</span></a>
</div>
</main></body>
</html>
